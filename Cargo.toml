[package]
name = "halodiffuse"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Legendofzaday/halodiffuse"
readme = "README.md"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
vulkano = { version = "0.35.2", default-features = false, features = ["macros"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0", features = ["blocking"] }
rayon = "1.12.0"
safetensors = "0.8.0"
png = "0.18.1"
libc = "0.2.191"

[build-dependencies]
hf-hub = { version = "1.0", features = ["blocking"] }