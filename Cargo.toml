[package]
name = "halodiffuse"
version = "1.0.0"
edition = "2024"
description = "Quick stable diffusion 3.5 large turbo inference."
license = "AGPL-3.0-only"
repository = "https://github.com/Legendofzaday/halodiffuse"
readme = "README.md"

[dependencies]
vulkano = { version = "0.35.2", default-features = false, features = ["macros"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }